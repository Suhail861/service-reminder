<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Channu Automobile Service Reminder</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px}
.card{max-width:520px;margin:auto;background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{margin-top:0}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#1565c0;color:#fff;font-size:15px;cursor:pointer}
button.secondary{background:#666}
pre{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h2>Channu Automobile</h2>
<label>Phone Number</label><input id="phone" maxlength="10">
<label>Bike Number</label><input id="bike">
<label><input type="checkbox" id="spd"> Speedometer Not Working</label>
<label>Odometer (km)</label><input id="odo" type="number">
<div class="row">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Time</label><input id="time" type="time"></div>
</div>
<h3>Preview</h3>
<pre id="preview"></pre>
<button onclick="wa()">Open WhatsApp</button>
<button onclick="sms()">Open SMS</button>
<button onclick="copyMsg()">Copy Message</button>
<button class="secondary" onclick="done()">Done</button>
<button class="secondary" onclick="resetForm()">Reset</button>
</div>
<script>
function init(){
 const d=new Date();
 document.getElementById('date').value=d.toISOString().slice(0,10);
 document.getElementById('time').value=d.toTimeString().slice(0,5);
 ['phone','bike','odo','date','time','spd'].forEach(id=>document.getElementById(id).addEventListener('input',update));
 update();
}
function fmt(n){return Number(n).toLocaleString('en-IN')}
function message(){
 const bike=document.getElementById('bike').value.toUpperCase();
 document.getElementById('bike').value=bike;
 const odo=document.getElementById('odo').value;
 const spd=document.getElementById('spd').checked;
 const dt=document.getElementById('date').value;
 const tm=document.getElementById('time').value;
 if(spd){
 return `
Your bike ${bike} is serviced on ${dt} at ${tm}, as the speedometer reading was unavailable during service, we recommend your next service after 2,000–2,500 km or within 3 months, whichever comes first,
Thank you for choosing Channu Automobile.`;
 }
 let next1=odo?Number(odo)+2000:null,next2=odo?Number(odo)+2500:null;
 return `
Your bike ${bike} is serviced on ${dt} at ${tm} with an odometer reading of ${fmt(odo)} km, your next service will be between ${fmt(next1)} km and ${fmt(next2)} km or within 3 months, whichever comes first,
Thank you for choosing Channu Automobile.`;
}
function update(){document.getElementById('preview').textContent=message();document.getElementById('odo').disabled=document.getElementById('spd').checked;}
function wa(){let p=document.getElementById('phone').value;if(p.length!=10){alert('Enter valid phone');return;}window.open(`https://wa.me/91${p}?text=`+encodeURIComponent(message()),'_blank');}
function sms(){let p=document.getElementById('phone').value;if(p.length!=10){alert('Enter valid phone');return;}window.location.href=`sms:${p}?body=`+encodeURIComponent(message());}
function copyMsg(){navigator.clipboard.writeText(message());alert('Message copied');}
function done(){if(confirm('Clear form?'))resetForm();}
function resetForm(){document.getElementById('phone').value='';document.getElementById('bike').value='';document.getElementById('odo').value='';document.getElementById('spd').checked=false;init();}
init();
</script>
</body></html>
